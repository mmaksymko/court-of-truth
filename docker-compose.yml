services:
  app:
    build:
      context: .
      target: app
    environment:
      COURT_ARTIFACTS_DIR: /app/artifacts
      COURT_OPERATION_RATE_PER_MINUTE: ${COURT_OPERATION_RATE_PER_MINUTE:-10}
      COURT_OPERATION_CONCURRENCY: ${COURT_OPERATION_CONCURRENCY:-4}
      COURT_UVICORN_LIMIT_CONCURRENCY: ${COURT_UVICORN_LIMIT_CONCURRENCY:-32}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - artifacts:/app/artifacts:ro
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    init: true

  train:
    build:
      context: .
      target: train
    profiles: ["train"]
    command: python -m training.train --out /app/artifacts
    volumes:
      - artifacts:/app/artifacts
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    init: true

volumes:
  artifacts:
